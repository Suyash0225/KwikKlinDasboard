<!-- Kwik Klin ke UI icons — ek hi sprite file.
     ============================================================
     Emoji UI icon nahi hote. Wo har OS par alag render hote hain (Windows
     ka 📊 aur Android ka 📊 ek jaise nahi), size aur baseline apne hisaab
     se lete hain, aur rangeen hone ki wajah se text ke saath align nahi
     karte. Ek business dashboard mein wo khilauna lagta hai.

     Bina build step ke sahi jawab yehi hai — SVG symbol sprite:

         <svg class="ic"><use href="/admin/static/icons.svg#i-dashboard"/></svg>

     Koi npm nahi, koi icon font nahi, koi extra request per icon nahi.
     Poori file ek baar aati hai aur cache ho jaati hai.

     SAB stroke-based hain aur `currentColor` lete hain, isliye icon apne
     aap us text ka rang le leta hai jiske saath baitha hai — active nav
     item par safed, warna slate. Rang yahan hardcode mat karna.

     viewBox har jagah 24x24 — mila-jula size icons ko line par uupar-neeche
     hila deta hai. -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <defs>
    <g id="_s" fill="none" stroke="currentColor" stroke-width="1.8"
       stroke-linecap="round" stroke-linejoin="round"></g>
  </defs>

  <symbol id="i-dashboard" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="9" rx="1.5"/>
    <rect x="14" y="3" width="7" height="5" rx="1.5"/>
    <rect x="14" y="12" width="7" height="9" rx="1.5"/>
    <rect x="3" y="16" width="7" height="5" rx="1.5"/>
  </symbol>

  <symbol id="i-inbox" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.6-4.6A8.3 8.3 0 0 1 3.6 11.5 8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4Z"/>
  </symbol>

  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <symbol id="i-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 3h14v18l-2.3-1.6-2.4 1.6-2.3-1.6L9.7 21l-2.4-1.6L5 21Z"/>
    <path d="M9 8h6M9 12h6"/>
  </symbol>

  <symbol id="i-users" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 20v-1.6a3.4 3.4 0 0 0-3.4-3.4H6.4A3.4 3.4 0 0 0 3 18.4V20"/>
    <circle cx="9.5" cy="8" r="3.4"/>
    <path d="M21 20v-1.6a3.4 3.4 0 0 0-2.6-3.3M15.5 4.8a3.4 3.4 0 0 1 0 6.4"/>
  </symbol>

  <symbol id="i-expense" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="6" width="19" height="13" rx="2.5"/>
    <path d="M2.5 10.5h19M6 15h3"/>
  </symbol>

  <symbol id="i-reports" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 20h18"/>
    <path d="M6 20v-6M11 20V8M16 20v-9M21 20V5"/>
  </symbol>

  <symbol id="i-campaign" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10v4a1.5 1.5 0 0 0 1.5 1.5H7l5 4V6.5l-5 4H5.5A1.5 1.5 0 0 0 4 12Z"/>
    <path d="M16.5 9.5a3.5 3.5 0 0 1 0 5M19 7a7 7 0 0 1 0 10"/>
  </symbol>

  <symbol id="i-task" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="3.5" width="17" height="17" rx="3"/>
    <path d="M8 12.5l2.8 2.8L16.5 9.5"/>
  </symbol>

  <symbol id="i-agent" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="8" width="16" height="12" rx="3"/>
    <path d="M12 8V4.5M9.5 14h.01M14.5 14h.01M1.5 13v3M22.5 13v3"/>
  </symbol>

  <symbol id="i-usage" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 17l5.5-6 4 3.5L21 6"/>
    <path d="M21 11V6h-5"/>
  </symbol>

  <symbol id="i-training" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4 2.5 8.5 12 13l9.5-4.5Z"/>
    <path d="M6.5 10.8V16c0 1.4 2.5 2.6 5.5 2.6s5.5-1.2 5.5-2.6v-5.2"/>
  </symbol>

  <symbol id="i-activity" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h4l2.5-7 5 14 2.5-7h4"/>
  </symbol>

  <symbol id="i-settings" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3.2"/>
    <path d="M19.4 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1v.2a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-2.8-1.1l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0-1.1-2.7h-.2a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.1-2.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3h.1a1.6 1.6 0 0 0 1-1.5v-.2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.2a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>
  </symbol>

  <symbol id="i-logout" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 20.5H5.5A2 2 0 0 1 3.5 18.5v-13a2 2 0 0 1 2-2h4"/>
    <path d="m15.5 16.5 4.5-4.5-4.5-4.5M20 12H9.5"/>
  </symbol>
</svg>
