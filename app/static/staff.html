<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Kwik Klin — Staff</title>
<link rel="stylesheet" href="/admin/static/staff.css?v=s2">
<link rel="manifest" href="/staff/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KK Staff">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- boot ----------------------------------------------------------------->
<!-- Pehle login screen SEEDHE dikhti thi aur `/me` ka jawab aane par
     chhupti thi — yani har refresh par logged-in aadmi ko bhi ek pal ke
     liye "Login" ka jhatka lagta tha, aur dheeme network par to lagta tha
     ki app ne nikal hi diya. Ab jab tak jawab na aaye, koi faisla nahi
     dikhaya jaata: sirf dukaan ka nishaan. -->
<section id="boot" class="boot">
  <div class="brand"><span class="logo">KK</span><div><b>Kwik Klin</b><small>Staff</small></div></div>
  <span class="spin"></span>
</section>

<!-- login ---------------------------------------------------------------->
<section id="login" class="login" hidden>
  <div class="card">
    <div class="brand"><span class="logo">KK</span><div><b>Kwik Klin</b><small>Staff</small></div></div>
    <h1>See your work</h1>
    <label for="lg-phone">Mobile number</label>
    <input id="lg-phone" type="tel" inputmode="numeric" autocomplete="username"
           placeholder="98xxxxxxxx" maxlength="15">
    <label for="lg-pass">Password</label>
    <div class="pwrap">
      <input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••">
      <button type="button" id="lg-eye" class="eye" aria-label="Show password">👁</button>
    </div>
    <div id="lg-err" class="err" role="alert"></div>
    <button id="lg-go" class="btn wide">Login</button>
    <p class="hint">Your owner or manager gives you this password. Lost it? Ask them for a new one.</p>
  </div>
</section>

<!-- app ------------------------------------------------------------------>
<section id="app" class="app" hidden>
  <header class="top">
    <div>
      <b id="who">—</b>
      <small id="whoRole"></small>
    </div>
    <div class="topr">
      <span id="planChip" class="chip"></span>
      <button id="btn-refresh" class="icobtn" aria-label="Refresh">↻</button>
    </div>
  </header>

  <div id="installbar" class="banner install" hidden>
    📲 Install this on your phone like an app
    <button class="linkbtn" id="btn-install">Install</button>
  </div>

  <div id="pwbanner" class="banner" hidden>
    First login — please change your password.
    <button class="linkbtn" id="pw-open">Change</button>
  </div>

  <div id="todaybar" class="todaybar" hidden></div>
  <nav class="tabs" id="tabs"></nav>
  <main id="list" class="list"></main>

  <nav class="bottom">
    <button data-nav="mine" class="on">🧺 Work</button>
    <button data-nav="route">🛵 Route</button>
    <button data-nav="bill" id="nav-bill">➕ New bill</button>
    <button data-nav="team" id="nav-team" hidden>👥 Team</button>
    <button data-nav="profile">👤 Profile</button>
  </nav>
</section>

<div id="modal-ov" class="modal-ov"><div class="modal" role="dialog" aria-modal="true"><div id="modal-body"></div></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/admin/static/staff.js?v=s2" defer></script>
</body>
</html>
