<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131820">
<title>Kwik Klin — Staff</title>
<link rel="stylesheet" href="/admin/static/staff.css?v=s8">
<link rel="manifest" href="/staff/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KK Staff">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- boot: jab tak server ne nahi bataya ki ye aadmi andar hai ya nahi,
     koi faisla nahi dikhaya jaata — warna har refresh par login jhalakti hai -->
<section id="boot" class="boot">
  <div class="mark"><i>KK</i><div><b>Kwik Klin</b><span>Staff</span></div></div>
  <span class="spin"></span>
</section>

<section id="login" class="login" hidden>
  <div class="sheet">
    <div class="mark spaced"><i>KK</i><div><b>Kwik Klin</b><span>Staff</span></div></div>
    <h1>See your work</h1>
    <p class="sub">Your owner or manager gives you these.</p>
    <label for="lg-phone">Mobile number</label>
    <input id="lg-phone" type="tel" inputmode="numeric" autocomplete="username" placeholder="98xxxxxxxx" maxlength="15">
    <label for="lg-pass">Password</label>
    <div class="pwrap">
      <input id="lg-pass" type="password" autocomplete="current-password" placeholder="••••••">
      <button type="button" id="lg-eye" class="eye" aria-label="Show password">👁</button>
    </div>
    <div id="lg-err" class="err" role="alert"></div>
    <button id="lg-go" class="btn go wide">Login</button>
    <p class="hint">Lost your password? Ask the owner for a new one.</p>
  </div>
</section>

<section id="app" class="app" hidden>
  <header class="top">
    <div class="who"><b id="who">—</b><span id="whoRole"></span></div>
    <div class="acts">
      <button id="btn-bell" class="iconbtn" aria-label="Replies">🔔<span id="bellN" class="bell-n" hidden>0</span></button>
      <button id="btn-refresh" class="iconbtn" aria-label="Refresh">↻</button>
    </div>
  </header>

  <div id="installbar" class="banner blue" hidden>
    Install this on your phone like an app
    <button class="linkbtn" id="btn-install">Install</button>
  </div>
  <div id="pwbanner" class="banner" hidden>
    First login — please change your password.
    <button class="linkbtn" id="pw-open">Change</button>
  </div>

  <div id="today" class="today" hidden></div>
  <nav class="chips" id="chips"></nav>
  <div class="searchrow" id="searchrow" hidden>
    <input id="q" type="search" placeholder="Bill number or customer name" autocomplete="off">
  </div>
  <main id="list" class="list"></main>

  <nav class="bottom" id="nav"></nav>
</section>

<div id="modal-ov" class="modal-ov"><div class="modal" role="dialog" aria-modal="true"><div id="modal-body"></div></div></div>
<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/admin/static/staff.js?v=s8" defer></script>
</body>
</html>
