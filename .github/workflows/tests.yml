name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - fix/tenant-recipient-isolation

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: laundry
          POSTGRES_PASSWORD: laundry
          POSTGRES_DB: laundry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U laundry -d laundry_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+asyncpg://laundry:laundry@127.0.0.1:5432/laundry_test
      APP_DATABASE_URL: postgresql+asyncpg://laundry:laundry@127.0.0.1:5432/laundry_test
      WHATSAPP_PROVIDER: waha
      WAHA_BASE_URL: http://127.0.0.1:9
      WAHA_API_KEY: ci-disabled
      WAHA_SESSION: test
      ANTHROPIC_API_KEY: ci-disabled
      MANAGER_PHONE: +919999900099
      ADMIN_API_KEY: ci-test-admin-key
      SHOP_NAME: Kwik Klin CI
      TOKEN_ENCRYPTION_KEY: ""
      VENDOR_API_KEY: ""
      ENVIRONMENT: development
      WHATSAPP_TOKEN: ""
      WHATSAPP_PHONE_NUMBER_ID: ""
      WHATSAPP_VERIFY_TOKEN: ""
      WHATSAPP_APP_SECRET: ""
      WAHA_WEBHOOK_SECRET: ""
      WAHA_WEBHOOK_HMAC_KEY: ""
      ESCALATION_CC_PHONE: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run tenant and WhatsApp isolation tests
        run: >-
          python -m pytest -q
          tests/test_scheduler_per_tenant.py
          tests/test_whatsapp_send.py
          tests/test_whatsapp_multitenant.py
          tests/test_agent_tools.py
          tests/test_scheduler_marketing.py -k "campaign"
          tests/test_campaigns_ui_contract.py
